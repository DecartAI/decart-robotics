# uv workspace root for the public decart-robotics repo. It ties together the SDK (sdk/ -> the
# decart-oasis package) and the demo extras (extras/ -> oasis-demo, the RL examples + visualization
# that build on the SDK). The Colab notebook is added in a later phase.
[tool.uv.workspace]
members = ["sdk", "extras"]

# In development, oasis-demo's `decart-oasis` dependency resolves to the LOCAL sdk/ checkout. This is
# dev-only metadata — the published oasis-demo wheel declares a plain `decart-oasis>=…` from PyPI.
[tool.uv.sources]
decart-oasis = { workspace = true }

[dependency-groups]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated protobuf stubs are not linted.
extend-exclude = ["sdk/decart_oasis/_proto/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "extras/tests"]
