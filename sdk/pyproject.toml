[project]
name = "decart-oasis"
version = "0.0.1"
description = "Python SDK for connecting to Decart's Oasis action-to-video model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Decart" }]
keywords = ["decart", "robotics", "action-to-video", "world-model", "oasis", "grpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core SDK only: the synchronous A2V gRPC client and its VP9/JPEG frame decoding. Anything heavier
# (RL, depth reward, S3, notebook visualization) lives in the separate `oasis-demo` package, so a
# user who only wants to talk to Oasis does not pull torch, the ML stack, or the Jupyter stack.
dependencies = [
    "av>=13.0",
    "grpcio>=1.64",
    "numpy>=1.24",
    "pillow>=10.0",
    # Stubs in _proto/ are gencode 4.25 (no runtime-version gate), so they load on any protobuf
    # >=4.25 — including the version preinstalled on Colab — without an upgrade-and-restart dance.
    "protobuf>=4.25",
]

[project.urls]
Homepage = "https://decart.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decart_oasis"]

[tool.hatch.build.targets.sdist]
# Keep the source distribution lean: ship the package and its protos, not the dev scaffolding.
include = ["decart_oasis", "protos", "README.md", "pyproject.toml"]
